name: Reusable Workflow Caller

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  call-reusable-workflow:
    # Replace with your real reusable workflow reference.
    uses: owner/repo/.github/workflows/file.yml@ref
    secrets: inherit
