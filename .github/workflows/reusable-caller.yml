name: PR Checks via Reusable Workflow

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  call-reusable-workflow:
    uses: ./.github/workflows/reusable-pr-checks.yml
    with:
      node-version: '20'
      run-tests: true
